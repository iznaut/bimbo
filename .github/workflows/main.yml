name: build

permissions:
  contents: write
  
on:
  push:
    branches:
      - main
    # paths:
    #   - 'version'

env:
  ITCH_USERNAME: iznaut
  ITCH_GAME_ID: bimbo

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ matrix.os.runner }}
    strategy:
      matrix:
        os: [
          { runner: 'macos-latest', channel: 'macos' },
          { runner: 'macos-15-intel', channel: 'macos-intel' },
          { runner: 'ubuntu-latest', channel: 'linux' },
          { runner: 'windows-latest', channel: 'windows' }
        ]

    steps:
      - uses: actions/checkout@v6.0.3
      
      - name: Install Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
      - name: npm install
        uses: bahmutov/npm-install@v1
      - name: nonplus
        run: mv deploy-nonplus.js deploy.js
      - name: electron packager
        run: npx @electron/packager . --extra-resource project-starters/ --ignore project-starters/ --out build/ --overwrite
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.os.channel }}
          path: build
      - name: Conventional Changelog Action
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.github_token }}
      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          release_name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
  deploy:
    name: Upload to Itch
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        channel:
          - macos
          - macos-intel
          - linux
          - windows
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.channel }}
          path: build/${{ matrix.channel }}
      - uses: KikimoraGames/itch-publish@v0.0.3
        with:
          butlerApiKey: ${{secrets.BUTLER_API_KEY}}
          gameData: ./build/${{ matrix.channel }}
          itchUsername: ${{env.ITCH_USERNAME}}
          itchGameId: ${{ env.ITCH_GAME_ID }}
          buildChannel: ${{ matrix.channel }}
          buildNumberFile: ./version
  notify:
    name: send update notification to Discord
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: get version
        run: echo "version=$(cat ./version)" >> $GITHUB_ENV
      - name: send discord message
        uses: appleboy/discord-action@v1.2.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          message: "${{ env.version }} now available on itch.io"