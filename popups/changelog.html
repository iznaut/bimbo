<!doctype html>
<html>
    <head>
        <link rel="stylesheet" href="./bulma.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>
    <body>
        <section class="section">
            <div class="container">
                <h1 class="title">changelog</h1>
                <div class="content">
                    {{#each @root}}
                        {{#if this.length }}
                            <h3>{{ @key }}</h3>
                            <ul>
                                {{#each this}}
                                    <li>{{ this }}</li>
                                {{/each}}
                            </ul>
                        {{/if}}
                    {{/each}}
                </div>
            </div>
        </section>
    </body>
</html>
